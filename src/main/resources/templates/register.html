<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8"/>
    <title>注册 - XXX在线招生考试</title>
    <link rel="stylesheet" href="/css/style.css"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
    <script th:if="${param.error==null}">
        alert("请注意：\n1. 注册账号务必使用自己的真实学号和姓名，否则会影响奖励的统计！\n2. 密码不支持找回和修改，请牢记你的密码。");
    </script>
</head>
<body>
<header class="page-header">
    <a href="https://qm.qq.com/q/P5422mPYeA" target="_blank" class="header-link">
        <img src="/images/lab-logo.jpg" alt="实验室 Logo" class="lab-logo">
        <div class="header-text">
            <h1>XXX在线招生考试</h1>
            <p>本平台由利刃网安攻防实验室研发</p>
        </div>
    </a>
</header>


<main class="main-container">
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.querySelector("form");
            const password = document.getElementById("password");
            const confirmPassword = document.getElementById("confirm_password");

            form.addEventListener("submit", function (e) {
                if (password.value !== confirmPassword.value) {
                    e.preventDefault();
                    alert("两次输入的密码不一致，请重新输入！");
                }
            });
        });
    </script>
    <form method="post" action="/register">
        <h2>注册</h2>
        <div class="error-msg" th:if="${param.error != null}">
            <span th:if="${param.error[0]=='exists'}">
                你注册的账户已存在
                <script>alert("注册失败：你注册的账户已存在！");</script>
            </span>
            <span th:if="${param.error[0]=='busy'}">
                你注册过于频繁，请稍后再试！
                <script>alert("注册失败：你注册过于频繁，请稍后再试！");</script>
            </span>
            <span th:if="${param.error[0]=='passcode'}">
                邀请码不正确！
                <script>alert("注册失败：你的邀请码不正确！");</script>
            </span>
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label>
            学号：
            <input type="text" name="username" required/>
        </label>

        <label>
            姓名：
            <input type="text" name="nickname" required/>
        </label>

        <label>
            手机号：
            <input type="text" name="phonenumber" required/>
        </label>

        <label>
            意向部门：
            <input type="text" name="part" required/>
        </label>

        <label>
            密码：
            <input type="password" name="password" id="password" required/>
        </label>

        <label>
            再次确认密码：
            <input type="password" id="confirm_password" required/>
        </label>

        <label>
            邀请码：
            <input type="password" name="passcode" id="passcode" required/>
        </label>

        <button type="submit">注册</button>

        <a href="/login">已有账号？去登录</a>
    </form>
</main>
<footer class="page-footer">
    <p>本网站由利刃网安攻防实验室提供技术支持。</p>
    <p>联系方式（QQ群）：xxxxxxxxx</p>
    <p><a href="http://beian.miit.gov.cn/" target="_blank">京ICP备xxxxxxxxx号</a></p>
</footer>
</body>
</html>
