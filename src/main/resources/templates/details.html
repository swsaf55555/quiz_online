<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <title>答题详情 - XXX在线招生考试</title>
    <link rel="stylesheet" href="/css/style_ranking.css">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
</head>
<body class="ranking-page">
<header class="page-header">
    <a href="https://qm.qq.com/q/P5422mPYeA" target="_blank" class="header-link">
        <img src="/images/lab-logo.jpg" alt="实验室 Logo" class="lab-logo">
        <div class="header-text">
            <h1>XXX在线招生考试</h1>
            <p>本平台由利刃网安攻防实验室研发</p>
        </div>
    </a>
</header>

<main class="ranking-container">
    <h2>答题详情</h2>
    <a href="/ranking">点击这里查看成绩排行</a>
    <script th:if="${!open_details}">alert("当前用户无法查看答题详情，请在完成答题后再次尝试！")</script>
    <div th:if="${open_details}">
        <table id="rankingTable">
            <thead>
            <tr>
                <th th:if="${admin}">学号</th>
                <th>姓名</th>
                <th th:if="${admin}">手机号</th>
                <th th:if="${admin}">意向部门</th>
                <th>成绩</th>
            </tr>
            </thead>
            <tbody id="rankingBody">
            <tr>
                <td th:text="${username}" th:if="${admin}"></td>
                <td th:text="${nickname}"></td>
                <td th:text="${phonenumber}" th:if="${admin}"></td>
                <td th:text="${part}" th:if="${admin}"></td>
                <td th:text="${score}"></td>
            </tr>
            </tbody>
        </table>
        <h3>答题记录明细</h3>
        <table>
            <thead>
            <tr>
                <th>序号</th>
                <th>题号</th>
                <th>题目</th>
                <th>选项</th>
                <th>答案</th>
                <th>得分</th>
                <th>超时</th>
                <th>解析</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="d,iterStat : ${detailList}">
                <td th:text="${iterStat.index + 1}"></td>
                <td th:text="${d.questionId}"></td>
                <td th:text="${d.question}"></td>
                <td>
                    <ul>
                        <li th:each="opt : ${d.options}" th:text="${opt}"></li>
                    </ul>
                </td>
                <td th:text="${d.userAnswer}"></td>
                <td th:text="${d.correct} ? '1' : '0'"></td>
                <td th:text="${d.timeout} ? '是' : '否'"></td>
                <td th:text="${d.explanation}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer class="page-footer">
    <p>本网站由利刃网安攻防实验室提供技术支持。</p>
    <p>联系方式（QQ群）：xxxxxxxxx</p>
    <p><a href="http://beian.miit.gov.cn/" target="_blank">京ICP备xxxxxxxxx号</a></p>
</footer>
</body>
</html>
