<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <title>答题 - XXX在线招生考试</title>
    <link rel="stylesheet" href="/css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
    <script>
        let timeLeft = 30;
        let timer = setInterval(function () {
            document.getElementById("timer").innerText = timeLeft;
            timeLeft--;
            if (timeLeft < 0) {
                clearInterval(timer);
                document.getElementById("quizForm").submit();
            }
        }, 1000);
    </script>
</head>
<body>
<header class="page-header">
    <a href="https://qm.qq.com/q/P5422mPYeA" target="_blank" class="header-link">
        <img src="/images/lab-logo.jpg" alt="实验室 Logo" class="lab-logo">
        <div class="header-text">
            <h1>XXX在线招生考试</h1>
            <p>本平台由利刃网安攻防实验室研发</p>
        </div>
    </a>
</header>


<main class="main-container">
    <form id="quizForm" th:action="@{'/quiz/answer/' + ${question.id}}" method="post">
        <input type="hidden" th:name="token" th:value="${token}"/>
        <h2 th:text="${question.question}"></h2>
        <p>剩余时间：<span id="timer">30</span>秒（仅供参考，最终以服务器计时为准）</p>
        <br>
        <div th:each="opt : ${question.options}">
            <label>
                <input type="radio" name="answer" th:value="${opt.substring(0,1)}"/>
                <span th:text="${opt}"></span>
            </label>
        </div>
        <button type="submit">提交答案</button>
        <p class="user-display">当前用户：<span class="username" th:text="${username}"></span></p>
    </form>

</main>
<footer class="page-footer">
    <p>本网站由利刃网安攻防实验室提供技术支持。</p>
    <p>联系方式（QQ群）：xxxxxxxxx</p>
    <p><a href="http://beian.miit.gov.cn/" target="_blank">京ICP备xxxxxxxxx号</a></p>
</footer>
</body>
</html>
