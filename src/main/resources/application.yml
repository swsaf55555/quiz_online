server:
  port: 10087

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/quiz_online?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DATA_USER:root}
    password: ${DATA_PASSWD:root123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
  spring:
    redis:
      host: localhost
      port: 6379

